name: Release

# Builds the source tarball and the x86_64 xbps packages (glibc and musl) and publishes
# them as a GitHub release. Two ways to release (the version must match every version
# location, see scripts/check-versions.sh):
#   - push a tag like v0.1.0, or
#   - Actions > Release > Run workflow with `version` set to 0.1.0: the release and
#     its v0.1.0 tag are created on the commit the workflow ran on. The run is refused
#     when that tag already exists, so a published release is never rebuilt.
# Running it by hand with `version` empty builds everything without publishing.
#
# Third-party actions are pinned by commit SHA (the comment names the release); the
# Void images and void-packages commit are pinned in packaging/void/images.env.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (empty: build only, do not publish)"
        required: false
        default: ""

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || (inputs.version != '' && format('v{0}', inputs.version) || '') }}

# Jobs get read access only; the publish job asks for write access itself.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Refuse a manual run for a version that is already released
        # A tag push creates the tag itself. For a manual run the publish step would
        # move nothing (the tag stays on the old commit) but overwrite the assets.
        if: github.ref_type != 'tag' && inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "::error::tag ${RELEASE_TAG} already exists. Bump the version, or delete the release and the tag first."
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::a release for ${RELEASE_TAG} already exists."
            exit 1
          fi
      - name: Release version matches every version location
        if: env.RELEASE_TAG != ''
        run: scripts/check-versions.sh "${RELEASE_TAG}"

  test:
    name: Tests
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/tauri-shell/frontend/package-lock.json
      - name: Rust (everything except the WebKit shell)
        run: cargo test --workspace --exclude phlegethon-tauri --locked
      - name: Install yt-dlp
        run: python3 -m pip install yt-dlp
      - name: Extractor plugins
        # test_extractors_offline.py skips every test and exits 0 without yt-dlp, so fail on any skip.
        run: |
          python3 packages/extractor-plugins/tests/test_parse_fixtures.py
          python3 packages/extractor-plugins/tests/test_extractors_offline.py -v 2>&1 | tee offline.log
          if grep -qi 'skipped' offline.log; then
            echo "::error::offline extractor tests were skipped"
            exit 1
          fi
      - name: Frontend
        working-directory: packages/tauri-shell/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

  source:
    name: Source tarball
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/tauri-shell/frontend/package-lock.json
      - name: Build the frontend
        working-directory: packages/tauri-shell/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Script tests
        run: scripts/test-scripts.sh
      - name: Make the tarball
        run: scripts/make-dist-tarball.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source
          path: dist/*.tar.gz
          if-no-files-found: error

  xbps:
    name: xbps (${{ matrix.libc }})
    needs: source
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        libc: [glibc, musl]
    env:
      CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source
          path: dist
      - name: Build with xbps-src in a Void container
        # The base image and the void-packages commit come from packaging/void/images.env.
        run: |
          . packaging/void/images.env
          if [ "${{ matrix.libc }}" = musl ]; then image=$VOID_IMAGE_MUSL; else image=$VOID_IMAGE_GLIBC; fi
          "$CONTAINER_ENGINE" run --rm --privileged -v "$PWD:/src" "$image" \
            /src/packaging/void/build-in-container.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xbps-${{ matrix.libc }}
          path: out/${{ matrix.libc }}/*.xbps
          if-no-files-found: error

  release:
    name: Publish
    needs: [test, xbps]
    if: github.ref_type == 'tag' || inputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Phlegethon ${{ env.RELEASE_TAG }}
          # A manual run creates the tag on the commit it built.
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          fail_on_unmatched_files: true
          body: |
            Phlegethon ${{ env.RELEASE_TAG }} for Void Linux (x86_64).

            | File | For |
            | --- | --- |
            | `phlegethon-*.x86_64.xbps` | glibc Void |
            | `phlegethon-*.x86_64-musl.xbps` | musl Void |
            | `phlegethon-*.tar.gz` | source, with the prebuilt frontend, for xbps-src |

            Install (pick the file for your libc):

            ```sh
            mkdir phlegethon-repo && cd phlegethon-repo
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/<file>.xbps
            xbps-rindex -a *.xbps
            sudo xbps-install --repository="$PWD" phlegethon
            ```

            It pulls in yt-dlp, ffmpeg, nodejs, xdg-utils, xdg-desktop-portal and dbus. Also install a portal backend for your desktop, for example `xdg-desktop-portal-gtk`. Check the download against `SHA256SUMS`.
