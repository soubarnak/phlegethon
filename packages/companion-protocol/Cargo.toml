[package]
name = "companion-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chrome Companion ↔ desktop hand-off protocol types and IPC"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
interprocess = "2"
log = "0.4"
url = "2"
ts-rs = { version = "12", optional = true }

[features]
# Generate TypeScript bindings for the hand-off result (`scripts/gen-ts-types.sh`).
ts = ["dep:ts-rs"]

[dev-dependencies]
tempfile = "3"
