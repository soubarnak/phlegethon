[package]
name = "companion-protocol"
version.workspace = true
edition.workspace = true
description = "Chrome Companion ↔ desktop hand-off protocol types and IPC"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
interprocess = "2"

[dev-dependencies]
tempfile = "3"
