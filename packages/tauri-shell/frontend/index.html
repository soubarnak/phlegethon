<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phlegethon</title>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <h1>Phlegethon</h1>
    <div class="header-actions">
      <button class="btn-icon" id="settingsBtn" type="button" title="Settings">Settings</button>
      <button class="btn-icon theme-toggle" id="themeToggle" type="button" title="Toggle theme">Dark</button>
    </div>
  </header>

  <!-- URL Bar -->
  <div class="url-bar">
    <input type="text" class="url-input" id="urlInput" placeholder="Paste or type a URL… then press Enter or click Enqueue" autofocus />
    <button class="btn" id="saveToBtn" type="button" title="Save to…">Save to…</button>
    <button class="btn btn-primary" id="enqueueBtn" type="button">Enqueue</button>
  </div>
  <div class="save-to-hint" id="saveToHint" hidden>
    <span id="saveToPath"></span>
    <button class="btn-link" id="saveToClear" type="button">Use Library Root default</button>
  </div>

  <!-- Drop zone (invisible, activated on dragover) -->
  <div class="drag-overlay" id="dragOverlay">Drop URL to enqueue</div>

  <!-- Queue -->
  <main class="app-main" id="appMain">
    <div class="queue-container" id="queueContainer">
      <div class="queue-empty" id="queueEmpty">
        <span>No downloads yet. Paste a URL above or drag one in.</span>
      </div>
      <div id="queueList"></div>
    </div>
    <div class="shortcuts-hint">
      <kbd>Ctrl+V</kbd> paste &amp; enqueue &nbsp;·&nbsp; <kbd>Esc</kbd> close probe sheet
    </div>
  </main>

  <!-- Probe Sheet (hidden by default) -->
  <div class="probe-overlay" id="probeOverlay">
    <div class="probe-sheet">
      <div class="probe-header">
        <div>
          <h2 id="probeTitle">Probe Results</h2>
          <span class="probe-header-url" id="probeUrl"></span>
        </div>
        <div class="probe-header-actions">
          <button class="btn btn-sm" id="probeSelectAll" type="button">Select all</button>
          <button class="btn btn-sm" id="probeDeselectAll" type="button">Deselect all</button>
          <button class="btn-icon" id="probeClose" type="button" title="Cancel">✕</button>
        </div>
      </div>
      <div class="probe-items" id="probeItems"></div>
      <div class="probe-footer">
        <div class="probe-save-to">
          <button class="btn" id="probeSaveToBtn" type="button">Save to…</button>
          <span class="probe-save-to-path" id="probeSaveToPath">Library Root default</span>
        </div>
        <div class="probe-footer-actions">
          <button class="btn" id="probeCancel" type="button">Cancel</button>
          <button class="btn btn-primary" id="probeConfirm" type="button">Download Selected</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings overlay -->
  <div class="settings-overlay" id="settingsOverlay" hidden>
    <div class="settings-sheet" role="dialog" aria-labelledby="settingsTitle">
      <div class="settings-header">
        <h2 id="settingsTitle">Settings</h2>
        <button class="btn-icon" id="settingsClose" type="button" title="Close">✕</button>
      </div>
      <div class="settings-body">
        <label class="settings-label" for="libraryRootPath">Library Root</label>
        <p class="settings-help">Default parent for Job Destinations. Core metadata lives here too.</p>
        <div class="settings-row">
          <input type="text" class="url-input" id="libraryRootPath" readonly />
          <button class="btn" id="libraryRootPick" type="button">Choose…</button>
          <button class="btn btn-primary" id="libraryRootApply" type="button">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Discard confirmation -->
  <div class="confirm-overlay" id="discardConfirmOverlay" hidden>
    <div class="confirm-sheet" role="alertdialog" aria-modal="true" aria-labelledby="discardConfirmTitle" aria-describedby="discardConfirmBody">
      <h2 id="discardConfirmTitle">Discard job?</h2>
      <p class="confirm-body" id="discardConfirmBody"></p>
      <div class="confirm-actions">
        <button class="btn" id="discardConfirmCancel" type="button">Cancel</button>
        <button class="btn btn-danger" id="discardConfirmOk" type="button">Discard</button>
      </div>
    </div>
  </div>

  <!-- Hidden file input for drop-to-enqueue -->
  <input type="file" id="fileDropZone" multiple hidden />

  <script type="module" src="app.js"></script>
</body>
</html>
