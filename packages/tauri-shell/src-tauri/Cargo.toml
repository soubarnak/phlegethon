[package]
name = "phlegethon-tauri"
version = "0.1.0"
description = "Phlegethon Tauri Platform Shell — Debian native download manager"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
crossbeam-channel = "0.5"
dirs = "5"
download-core = { path = "../../download-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
