[package]
name = "phlegethon-tauri"
version = "0.1.0"
description = "Phlegethon Platform Shell — Tauri 2 download manager for Void Linux"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "phlegethon"
path = "src/main.rs"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
companion-protocol = { path = "../../companion-protocol" }
crossbeam-channel = "0.5"
dirs = "5"
download-core = { path = "../../download-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
# Default feature is rfd/gtk3 — deadlocks with WebKitGTK (Tauri Linux) because both
# own the GTK main loop. xdg-portal uses ashpd/D-Bus instead.
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
