[package]
name = "download-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["socks-proxy", "json"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
regex = "1"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
fs2 = "0.4"
quick-xml = "0.42"
libc = "0.2"
ts-rs = { version = "12", optional = true }

[features]
# Generate TypeScript bindings for the types that cross the IPC boundary (`scripts/gen-ts-types.sh`).
ts = ["dep:ts-rs"]

[dev-dependencies]
tempfile = "3"
