[package]
name = "download-core"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
generate-bindings = []

[build-dependencies]
# csbindgen is only used when feature=generate-bindings

[dependencies]
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }
url = "2"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
