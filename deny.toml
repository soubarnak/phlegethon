# cargo-deny policy. Run with `cargo deny check` (CI job "Dependency policy").

[graph]
# Evaluate every target and feature in Cargo.lock, so licenses of platform-only crates are checked too.
all-features = true

[advisories]
version = 2
# Unmaintained-only advisories with no upgrade available: cargo-deny reports "No safe upgrade
# is available" for each. All come from the GTK 3 and D-Bus crates that tauri 2 pins.
# Remove an entry as soon as the upstream crate moves on.
ignore = [
    # proc-macro-error 1.0.4: build-time proc macro used by glib-macros 0.18 (tauri's GTK 3 stack).
    { id = "RUSTSEC-2024-0370", reason = "build-time proc macro pulled by tauri's GTK 3 stack (glib-macros 0.18); no safe upgrade" },
    # zvariant, zvariant_derive and zbus_names: D-Bus stack behind ashpd (rfd), notify-rust and tauri plugins.
    { id = "RUSTSEC-2026-0370", reason = "zvariant is pulled by zbus 5 through ashpd, notify-rust and tauri plugins; no safe upgrade" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is pulled by zbus_macros 5 through the same D-Bus stack; no safe upgrade" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4 is pulled through zbus 5 by the same D-Bus stack; no safe upgrade" },
]

[licenses]
version = 2
# Only licenses that the current dependency tree uses. Add one here when a new crate
# needs it, after checking the license text; do not allow a whole family blindly.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions are reported, not failed: the Tauri and GTK stacks pin their own copies.
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
